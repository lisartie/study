<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/header.css">
    <title>PurpleSchool</title>
</head>
<body>
    <header class="header">
        <div class="header__wrapper">
            <picture class="logotype">
                <a href="#"><img src="assets/images/logo.svg"  class="logotype__image" alt="Логотип purpleschool"></a>
            </picture>
            <nav class="navigation">
                <ul class="navigation__list">
                    <li class="navigation__paragraph navigation__paragraph_active"><a href="#" class="navigation__link" type="button">Курсы</a></li>
                    <li class="navigation__paragraph"><a href="#" class="navigation__link" type="button">О школе</a></li>
                    <li class="navigation__paragraph"><a href="#" class="navigation__link" type="button">Блог</a></li>
                    <li class="navigation__paragraph"><a href="#" class="navigation__link" type="button">База знаний</a></li>
                </ul>
            </nav>
            <a href="#" class="login" type="button">
                <picture class="login__picture">
                    <img class="login__image" src="assets/images/user.svg" alt="Иконка пользователя">
                </picture>
                <p class="login__button">Вход</p>
            </a>
        </div>

    </header>
    <main></main>
    <footer></footer>
</body>
</html>
