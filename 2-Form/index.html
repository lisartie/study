<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <title>My work</title>
</head>

<body>

    <main class="main">
        <section class="registration">
            <div class="diiiiv">
                <div class="registration__block">
                <h1 class="registration__title">Регистрация</h1>
                <p class="registration__text">Уже есть аккаунт? <a href="" class="registration__link">Войти</a></p>
                </div>
        
                <form action="/main.css" class="registration__form">
                    <input type="text" placeholder="Название компании" class="form__input" />
        
                    <div class="form__block">
                        <input type="text" placeholder="Имя" class="form__input form__input_name" required />
                        <input type="text" placeholder="Фамилия" class="form__input form__input_surname" required />
                    </div>
        
                    <input type="email" placeholder="E-mail" class="form__input" required />
                    <button class="form__button">Зарегистрироваться &rarr;</button>

                    <div class="form__block form__block_center">
                        <input type="checkbox" id="accept" class="form__checkbox" required>
                        <label for="accept" class="form__label">Я прочитал и принимаю <a href="#" class="form__link">Условия использования</a></label>
                    </div>
                </form>
            </div>
            
        </section>
        

    </main>
    
    
    </form>

</body>

</html>
